<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reto 2</title>
    <style>
        .oculto {
            display: none;
        }
    </style>
</head>
<body>

    <button id="btn">Mostrar / Ocultar</button>


    <p id="texto" class="oculto">
        texto que se ocultaaaa
    </p>

    <script>
        const boton = document.getElementById("btn");
        const parrafo = document.getElementById("texto");

        boton.addEventListener("click", function() {
            parrafo.classList.toggle("oculto");
        });
    </script>
    <footer>Alumno: Tomás Carreras Scheitlin</footer>
</body>
</html>
