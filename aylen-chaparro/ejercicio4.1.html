<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
</head>
<style>
      
.contenedor {
  display: grid;
  grid-template-columns: repeat(2, 1fr); 
  gap: 20px; 
}

.tarjeta {
  display: flex;
  flex-direction: column; 
  min-height: 250px; 
  padding: 20px;
  border: 1px solid #ccc; 
  border-radius: 8px;
}


.tarjeta span {
  margin: auto;
  text-align: center;
  font-weight: bold;
}


.tarjeta button {
  margin-top: auto; 
  padding: 10px 20px;
  cursor: pointer;
  border: none;
  border-radius: 4px;
  color: white;
  width: 100%; 
  background-color: #919090;
}
.caja{
  width: 250px;
  height: 250px;
  float: none;
  margin: 5px;
}
.rojo{
  background-color: rgb(255, 142, 142);
}
.amarillo{
  background-color: rgb(250, 250, 139);
}
.verde{
  background-color: rgb(143, 255, 143);
}
.azul{
  background-color: rgb(149, 149, 255);
}
.en-carrito{
  background-color: rgb(110, 192, 110);
}
</style>
<script>
  document.addEventListener('DOMContentLoaded',function(){
  const buttons = document.querySelectorAll(".boton")
  buttons.forEach(function(button){
    button.addEventListener('click',function(){
       const tarjeta = button.closest(".tarjeta")
       const caja = tarjeta.querySelector(".caja")
       const stock = Number(caja.dataset.stock)
       if(stock>0){
          tarjeta.classList.add("en-carrito")
          alert("Producto agregado al carrito!")
        } else{
          alert("sin stock")
        }
    })
  })
 })
</script>
<body>
    <div class="contenedor">
        <div class="tarjeta">
          <div data-stock="2"class="caja rojo"></div>
          <span>Stock: 2</span>
          <button class="boton">Agregar carrito</button>
    </div>
    <div class="tarjeta">
          <div data-stock="4" class="caja amarillo"></div>
          <span>Stock: 4</span>
          <button class="boton">Agregar carrito</button>
    </div>
    <div class="tarjeta">
          <div data-stock="2" class="caja verde"></div>
          <span>Stock: 2</span>
          <button class="boton">Agregar carrito</button>
    </div>
    <div class="tarjeta">
          <div data-stock="0" class="caja azul"></div>
          <span>Sin stock</span>
          <button class="boton">Agregar carrito</button>
    </div>
            

    </div>
</body>
</html>
