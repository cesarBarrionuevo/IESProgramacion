<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const boton = document.querySelector(".boton");
        const cuadrado = document.querySelector(".cuadrado");
        cuadrado.addEventListener("mouseenter", function() {
            cuadrado.classList.add("zoom");
        });
        cuadrado.addEventListener("mouseleave", function() {
            cuadrado.classList.remove("zoom");
        });
        boton.addEventListener("mouseenter", function() {
            boton.textContent = "Estas adentro!";
            boton.style.backgroundColor = "#e74c3c";
        });
        boton.addEventListener("mouseleave", function() {
            boton.textContent = "Hover aqui";
            boton.style.backgroundColor = "#2ecc71";
        });
    });
</script>
<style>
    .contenedor {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 20px auto;
        background-color: #f0f0f0;
        padding: 20px;
        border-radius: 10px;
        gap: 20px;
    }

    .cuadrado {
        width: 200px;
        height: 200px;
        background-color: #3498db;
        cursor: pointer;
        
    }

    .boton {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #2ecc71; 
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    .zoom {
        transform: scale(1.1);
        transition: 0.3s;
        background-color: #e74c3c; 
        
    }
</style>

<body>
    <div class="contenedor">
        <h1>Ejercicio 2</h1>
        <div class="cuadrado"></div>
        <button class="boton">Hover aqui</button>
    </div>
</body>
</html>
