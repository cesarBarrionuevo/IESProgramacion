<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 2</title>
</head>
<body>
    <button id="btn">Hover aca</button>

    <script> 
        document.addEventListener("DOMContentLoaded", function() {
const parrafo = document.getElementById("parrafo2");
// mouseenter: se dispara cuando el cursor ENTRA al elemento
parrafo.addEventListener("mouseenter", function() {
parrafo.classList.add("resaltado");
});
// mouseleave: se dispara cuando el cursor SALE del elemento
parrafo.addEventListener("mouseleave", function() {
parrafo.classList.remove("resaltado");
});
});
    </script>
    <footer>Alumno: Tomás Carreras Scheitlin</footer>
</body>
</html>
